[package]
name = "comfyui-installer"
version = "1.0.0"
description = "ComfyUI One-Click Installer"
authors = ["zhirai-tech"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "native-tls", "image-ico", "image-png", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
anyhow = "1"
thiserror = "1"
regex = "1"
sysinfo = "0.30"
