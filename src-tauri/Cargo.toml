[package]
name = "comfyui-installer"
version = "1.1.0"
description = "ComfyUI Local Executor"
authors = ["zhirai-tech"]
edition = "2021"

[dependencies]
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
anyhow = "1"
thiserror = "1"
regex = "1"
sysinfo = "0.30"
